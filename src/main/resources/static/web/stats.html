<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
    <title>访问统计 - 短网址</title>
    <style>
        body {
            background: #f5f6fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #333;
        }
        .page {
            max-width: 1000px;
            margin: 32px auto;
            padding: 0 20px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, .06);
            padding: 22px 26px;
            margin-bottom: 20px;
        }
        .head h1 {
            font-size: 22px;
            margin: 0 0 8px;
            font-weight: 600;
        }
        .head .muted {
            color: #8a8f99;
            font-size: 13px;
            margin: 0 0 16px;
            line-height: 1.7;
        }
        .head code {
            background: #f2f3f5;
            padding: 1px 6px;
            border-radius: 4px;
            color: #1e9fff;
        }
        .toolbar .layui-btn {
            margin-right: 8px;
        }
        #chart {
            width: 100%;
            height: 380px;
        }
        .empty-tip {
            text-align: center;
            color: #999;
            padding: 26px 0;
        }
        .org-url {
            color: #666;
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            vertical-align: bottom;
        }
        .count-badge {
            display: inline-block;
            min-width: 42px;
            padding: 2px 10px;
            border-radius: 12px;
            background: #e8f4ff;
            color: #1e9fff;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="card head">
        <h1>访问统计</h1>
        <p class="muted">
            数据实时来自 Redis ZSet <code>u:access_count:zset</code>：
            每次访问短链（<code>/u/{shortTarget}</code>）都会给该短码的分数 +1，这里按访问次数倒序展示。
        </p>
        <div class="toolbar">
            <button class="layui-btn layui-btn-sm" id="refresh-btn">刷新数据</button>
            <a class="layui-btn layui-btn-sm layui-btn-primary" href="/">返回生成页</a>
        </div>
    </div>

    <div class="card">
        <div id="chart"></div>
        <div id="chart-empty" class="empty-tip" style="display:none;">
            暂无访问数据，先去生成一条短链并访问它吧。
        </div>
    </div>

    <div class="card">
        <table class="layui-table" lay-size="sm" style="margin:0;">
            <colgroup>
                <col width="60">
                <col width="160">
                <col>
                <col width="120">
            </colgroup>
            <thead>
            <tr>
                <th>#</th>
                <th>短码</th>
                <th>原始链接</th>
                <th>访问次数</th>
            </tr>
            </thead>
            <tbody id="tbody">
            <tr>
                <td colspan="4" class="empty-tip">加载中…</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/static/js/echarts.min.js"></script>
<script>
    (function () {
        var chart = echarts.init(document.getElementById('chart'));
        var chartEl = document.getElementById('chart');
        var emptyEl = document.getElementById('chart-empty');

        function truncate(str, max) {
            if (!str) {
                return '-';
            }
            return str.length > max ? str.slice(0, max) + '…' : str;
        }

        function renderChart(list) {
            if (!list.length) {
                chartEl.style.display = 'none';
                emptyEl.style.display = 'block';
                chart.clear();
                return;
            }
            chartEl.style.display = 'block';
            emptyEl.style.display = 'none';

            var names = list.map(function (item) {
                return item.shortTarget;
            });
            var values = list.map(function (item) {
                return item.count;
            });

            chart.setOption({
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {type: 'shadow'},
                    formatter: function (params) {
                        var p = params[0];
                        return '短码：' + p.name + '<br/>访问次数：' + p.value;
                    }
                },
                grid: {left: 90, right: 60, top: 20, bottom: 30},
                xAxis: {
                    type: 'value',
                    name: '访问次数',
                    minInterval: 1,
                    splitLine: {lineStyle: {color: '#eef0f4'}}
                },
                yAxis: {
                    type: 'category',
                    data: names,
                    inverse: true,
                    axisTick: {show: false}
                },
                series: [{
                    type: 'bar',
                    data: values,
                    barWidth: 18,
                    itemStyle: {
                        color: '#1e9fff',
                        borderRadius: [0, 4, 4, 0]
                    },
                    label: {
                        show: true,
                        position: 'right',
                        color: '#1e9fff',
                        fontWeight: 'bold'
                    }
                }]
            }, true);
        }

        function renderTable(list) {
            var tbody = document.getElementById('tbody');
            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-tip">暂无访问数据</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(function (item, index) {
                var org = item.orgUrl || '-';
                var shortUrl = item.shortUrl || ('/u/' + item.shortTarget);
                return '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td><a href="' + shortUrl + '" target="_blank" style="color:#1e9fff;">' + item.shortTarget + '</a></td>' +
                    '<td><span class="org-url" title="' + org.replace(/"/g, '&quot;') + '">' + truncate(org, 60) + '</span></td>' +
                    '<td><span class="count-badge">' + item.count + '</span></td>' +
                    '</tr>';
            }).join('');
        }

        function load() {
            fetch('/stats/top?limit=10', {headers: {'Accept': 'application/json'}})
                .then(function (resp) {
                    return resp.json();
                })
                .then(function (res) {
                    if (!res.success) {
                        alert(res.msg || '加载失败');
                        return;
                    }
                    var list = res.data || [];
                    renderChart(list);
                    renderTable(list);
                })
                .catch(function (err) {
                    console.error(err);
                    document.getElementById('tbody').innerHTML =
                        '<tr><td colspan="4" class="empty-tip">加载失败，请确认服务已启动</td></tr>';
                });
        }

        document.getElementById('refresh-btn').addEventListener('click', load);
        window.addEventListener('resize', function () {
            chart.resize();
        });

        load();
    })();
</script>
</body>
</html>
